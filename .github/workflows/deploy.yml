name: Build Push and Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. pull
      - name: Checkout
        uses: actions/checkout@v4

      # 2. DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build + Push Docker Image
      - name: Build and Push Image
        run: |
          docker build --no-cache -t ${{ secrets.DOCKERHUB_USERNAME }}/my_app:latest ./my_app_python
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my_app:latest

      # 4. AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # 5. ECS pull latest
      - name: Check ECS cluster exists
        id: check-ecs
        run: |
          if aws ecs describe-clusters \
            --clusters my-app-cluster \
            --region ap-northeast-1 \
            --query "clusters[0].status" \
            --output text | grep -q ACTIVE; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 6. if have ECS
      - name: Force new ECS deployment
        if: steps.check-ecs.outputs.exists == 'true'
        run: |
          aws ecs update-service \
            --cluster my-app-cluster \
            --service my-app-service \
            --force-new-deployment \
            --region ap-northeast-1

      # 7. if donot have ECS
      - name: Skip ECS deployment
        if: steps.check-ecs.outputs.exists == 'false'
        run: |
          echo "ECS cluster does not exist. Skip deployment."