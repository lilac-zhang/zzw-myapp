<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">📝 Todo App</h1>

    <div class="text-end mb-3">
        <a href="/add" class="btn btn-primary">+ Add Todo</a>
    </div>

    <ul class="list-group">
        {% for t in todos %}
        <li class="list-group-item d-flex justify-content-between align-items-center">

            <div>
                {% if t[2] %}
                    <span class="text-decoration-line-through text-muted">{{ t[1] }}</span>
                {% if t[3] %}
                    <img src="{{ t[3] }}" width="100">
                {% else %}
                    {{ t[1] }}
                {% endif %}
            </div>

            <div>
                <a href="/{{ t[0] }}/toggle" class="btn btn-sm btn-secondary">✔</a>
                <a href="/{{ t[0] }}/edit" class="btn btn-sm btn-warning">✏️</a>
                <a href="/{{ t[0] }}/delete" class="btn btn-sm btn-danger">🗑</a>
            </div>

        </li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
